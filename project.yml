name: MamStudy
options:
  bundleIdPrefix: com.cunz
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: 2.1.0
    CURRENT_PROJECT_VERSION: '7'
    TARGETED_DEVICE_FAMILY: 1,2
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    STUDY_APP_GROUP: group.com.cunz.mamstudy
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targetTemplates:
  MainApp:
    type: application
    platform: iOS
    sources:
    - path: App
    - path: Storage
    - path: Core
    - path: Shared
    - path: Resources
    dependencies:
    - package: ZIPFoundation
    - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cunz.mamstudy
        PRODUCT_NAME: $(TARGET_NAME)
        INFOPLIST_FILE: Config/App-Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: false
        STUDY_WIDGETS_ENABLED: false
targets:
  MamStudy:
    templates:
    - MainApp
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/MamStudy.entitlements
        STUDY_WIDGETS_ENABLED: true
    dependencies:
    - target: MamStudyWidgets
      embed: true
    scheme: {}
  MamStudyBasic:
    templates:
    - MainApp
    scheme: {}
  MamStudyWidgets:
    type: app-extension
    platform: iOS
    sources:
    - path: Widget
    - path: Shared
    - path: Core
    - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cunz.mamstudy.widgets
        PRODUCT_NAME: MamStudyWidgets
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/MamStudy.entitlements
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  MamStudyManaged:
    templates:
    - MainApp
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/MamStudyManaged.entitlements
        STUDY_WIDGETS_ENABLED: 'YES'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MAM_SCREEN_TIME
    dependencies:
    - target: MamStudyWidgets
      embed: true
    - target: MamFocusMonitor
      embed: true
    scheme: {}
  MamFocusMonitor:
    type: app-extension
    platform: iOS
    sources:
    - path: FocusMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cunz.mamstudy.focusmonitor
        PRODUCT_NAME: MamFocusMonitor
        INFOPLIST_FILE: Config/FocusMonitor-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/FocusMonitor.entitlements
        GENERATE_INFOPLIST_FILE: 'NO'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
